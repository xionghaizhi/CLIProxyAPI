name: custom-harbor-deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable Harbor image tag
        required: true
        type: string
      deploy:
        description: Deploy after the image is pushed
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: custom-harbor-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64, cpa-harbor]
    outputs:
      image_ref: ${{ steps.metadata.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate image metadata
        id: metadata
        env:
          HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
          HARBOR_IMAGE_NAME: ${{ vars.HARBOR_IMAGE_NAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          : "${HARBOR_REGISTRY:?Set the HARBOR_REGISTRY repository variable}"
          : "${HARBOR_PROJECT:?Set the HARBOR_PROJECT repository variable}"
          : "${HARBOR_IMAGE_NAME:?Set the HARBOR_IMAGE_NAME repository variable}"
          if [[ ! "$HARBOR_REGISTRY" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "HARBOR_REGISTRY must be host[:port] without a scheme or path" >&2
            exit 1
          fi
          if [[ ! "$HARBOR_PROJECT" =~ ^[A-Za-z0-9._-]+$ || ! "$HARBOR_IMAGE_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid Harbor project or image name" >&2
            exit 1
          fi
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $IMAGE_TAG" >&2
            exit 1
          fi
          image_ref="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${HARBOR_IMAGE_NAME}:${IMAGE_TAG}"
          {
            echo "image_ref=$image_ref"
            echo "version=$IMAGE_TAG"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
          tags: ${{ steps.metadata.outputs.image_ref }}

  deploy-canary:
    if: ${{ inputs.deploy }}
    needs: build
    runs-on: [self-hosted, linux, x64, cpa-harbor]
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.CPA_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CPA_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/cpa_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/cpa_deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy canary
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          DEPLOY_HOST: ${{ vars.CPA_CANARY_HOST }}
          DEPLOY_USER: ${{ vars.CPA_DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.CPA_CANARY_DEPLOY_DIR }}
          COMPOSE_FILE: ${{ vars.CPA_CANARY_COMPOSE_FILE }}
          HEALTH_URL: ${{ vars.CPA_CANARY_HEALTH_URL }}
          SSH_KEY_PATH: ${{ runner.temp }}/cpa_deploy
        run: bash .github/scripts/deploy-custom-image.sh

  deploy-secondary:
    if: ${{ inputs.deploy }}
    needs: [build, deploy-canary]
    runs-on: [self-hosted, linux, x64, cpa-harbor]
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.CPA_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CPA_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/cpa_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/cpa_deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy secondary
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          DEPLOY_HOST: ${{ vars.CPA_SECONDARY_HOST }}
          DEPLOY_USER: ${{ vars.CPA_DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.CPA_SECONDARY_DEPLOY_DIR }}
          COMPOSE_FILE: ${{ vars.CPA_SECONDARY_COMPOSE_FILE }}
          HEALTH_URL: ${{ vars.CPA_SECONDARY_HEALTH_URL }}
          SSH_KEY_PATH: ${{ runner.temp }}/cpa_deploy
        run: bash .github/scripts/deploy-custom-image.sh
